[package]
name = "psynet-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.9"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5.0", features = ["cors"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
psynet = { path = "vendor/psynet-0.1.37" }
